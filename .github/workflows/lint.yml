name: Node.js build

on:
    push:
        branches: ['main']
    # pull_request:
    #     branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.1.2
            - name: Use Node.js from .nvmrc
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'
            - run: pnpm ci
            - run: pnpm run build --if-present
            - run: pnpm run lint
